# API server

- query: irate(apiserver_request_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",verb="POST", resource="pods", subresource="binding", code="201"}[2m]) > 0
  metricName: schedulingThroughput

- query: histogram_quantile(0.99, sum(irate(apiserver_request_duration_seconds_bucket{cluster="{{.GKE_MC_CLUSTER_NAME}}",verb=~"LIST|GET", subresource!~"log|exec|portforward|attach|proxy"}[2m])) by (le, resource, verb, scope, cluster)) > 0
  metricName: readOnlyAPICallsLatency

- query: histogram_quantile(0.99, sum(irate(apiserver_request_duration_seconds_bucket{cluster="{{.GKE_MC_CLUSTER_NAME}}",verb=~"POST|PUT|DELETE|PATCH", subresource!~"log|exec|portforward|attach|proxy"}[2m])) by (le, resource, verb, scope, cluster)) > 0
  metricName: mutatingAPICallsLatency

- query: sum(irate(apiserver_request_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",verb!="WATCH"}[2m])) by (verb,resource,code, cluster) > 0
  metricName: APIRequestRate

- query: sum(apiserver_current_inflight_requests{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (request_kind, cluster)
  metricName: apiServerInflightRequests

- query: sum(apiserver_storage_objects{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (resource, cluster)
  metricName: apiServerStorageObjects

- query: sum(irate(apiserver_flowcontrol_rejected_requests_total{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (priority_level, flow_schema, cluster) > 0
  metricName: apiServerFlowControlRejections

- query: sum(apiserver_flowcontrol_current_inqueue_requests{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (priority_level, flow_schema, cluster)
  metricName: apiServerFlowControlQueuedRequests

- query: histogram_quantile(0.99, sum(irate(apiserver_flowcontrol_request_wait_duration_seconds_bucket{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (le, priority_level, flow_schema, cluster)) > 0
  metricName: apiServerFlowControlWaitLatency


# Scheduler Metrics

# Pending pods in scheduler queues
- query: max(scheduler_pending_pods{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (queue, cluster)
  metricName: schedulerPendingPods

# Scheduler attempts per second
- query: sum(rate(scheduler_schedule_attempts_total{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (result, cluster) > 0
  metricName: schedulerAttempts

# E2E pod scheduling latency (p99)
- query: histogram_quantile(0.99, sum(rate(scheduler_pod_scheduling_sli_duration_seconds_bucket{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (le, cluster)) > 0
  metricName: schedulerE2ELatency


# Containers & pod metrics

- query: (sum(irate(container_cpu_usage_seconds_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",name!=""}[2m]) * 100) by (container, pod, node, cluster)) > 0
  metricName: containerCPU

- query: sum(container_memory_rss{cluster="{{.GKE_MC_CLUSTER_NAME}}",name!=""}) by (container, pod, node, cluster)
  metricName: containerMemory

# Capture raw throttling metrics separately
- query: sum(rate(container_cpu_cfs_throttled_periods_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",name!=""}[2m])) by (container, pod, node, cluster)
  metricName: containerCPUThrottledPeriods

- query: sum(rate(container_cpu_cfs_periods_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",name!=""}[2m])) by (container, pod, node, cluster)
  metricName: containerCPUTotalPeriods


# Kubelet metrics

- query: sum(rate(container_cpu_usage_seconds_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",id="/system.slice/kubelet.service"}[2m]) * 100) by (node, cluster)
  metricName: kubeletCPU

- query: sum(container_memory_rss{cluster="{{.GKE_MC_CLUSTER_NAME}}",id="/system.slice/kubelet.service"}) by (node, cluster)
  metricName: kubeletMemory

# Kubelet Pod Worker
- query: histogram_quantile(0.99, sum(irate(kubelet_pod_worker_duration_seconds_bucket{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (operation_type, node, le, cluster)) > 0
  metricName: kubeletPodWorkerLatencyBucket

# Kubelet PLEG
- query: histogram_quantile(0.99, sum(rate(kubelet_pleg_relist_duration_seconds_bucket{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (node, le, cluster)) > 0
  metricName: kubeletPLEGLatencyBucket

# Runtime operations rate (containerd interaction health)
- query: sum(rate(kubelet_runtime_operations_total{cluster="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (node, operation_type, cluster) > 0
  metricName: kubeletRuntimeOperations


# Containerd Usage

- query: (sum(irate(container_cpu_usage_seconds_total{cluster="{{.GKE_MC_CLUSTER_NAME}}",id="/system.slice/containerd.service"}[2m])*100) by (container, pod, node, cluster)) > 0
  metricName: containerdCPU

- query: sum(container_memory_rss{cluster="{{.GKE_MC_CLUSTER_NAME}}",id="/system.slice/containerd.service"}) by (container, pod, node, cluster)
  metricName: containerdMemory


# Node metrics: CPU & Memory

- query: sum(irate(kubernetes_io:node_cpu_core_usage_time{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (node_name, cluster) > 0
  metricName: nodeCPU-Workers

- query: sum(kubernetes_io:node_memory_used_bytes{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeMemoryUtilization-Workers

# NEW: CPU Allocatable (capacity available for pods)
- query: sum(kubernetes_io:node_cpu_allocatable_cores{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeCPUAllocatable

# NEW: CPU Allocatable Utilization (% of allocatable CPU used)
- query: sum(kubernetes_io:node_cpu_allocatable_utilization{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeCPUAllocatableUtilization

# NEW: Memory Allocatable (capacity available for pods)
- query: sum(kubernetes_io:node_memory_allocatable_bytes{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeMemoryAllocatable

# NEW: Memory Allocatable Utilization (% of allocatable memory used)
- query: sum(kubernetes_io:node_memory_allocatable_utilization{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeMemoryAllocatableUtilization

# NEW: Network I/O (important with 1000 pods)
- query: sum(rate(kubernetes_io:node_network_received_bytes_count{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (node_name, cluster) > 0
  metricName: nodeNetworkReceived

- query: sum(rate(kubernetes_io:node_network_sent_bytes_count{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}[2m])) by (node_name, cluster) > 0
  metricName: nodeNetworkSent

# NEW: Ephemeral Storage (disk pressure detection)
- query: sum(kubernetes_io:node_ephemeral_storage_used_bytes{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeEphemeralStorageUsed

- query: sum(kubernetes_io:node_ephemeral_storage_allocatable_bytes{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodeEphemeralStorageAllocatable

# NEW: PID usage (can hit limits with many containers)
- query: sum(kubernetes_io:node_pid_used{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodePIDUsed

- query: sum(kubernetes_io:node_pid_limit{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, cluster)
  metricName: nodePIDLimit

# NEW: Node status conditions (health monitoring)
- query: sum(kubernetes_io:node_status_condition{cluster_name="{{.GKE_MC_CLUSTER_NAME}}"}) by (node_name, status, condition, cluster)
  metricName: nodeStatusCondition

# Cluster metrics

- query: sum(kube_pod_status_phase{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (phase, cluster)
  metricName: podStatusCount

- query: sum(kubelet_running_pods{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (instance, cluster)
  metricName: podDistribution

# Unschedulable pods - detect scheduler capacity issues
- query: sum(kube_pod_status_unschedulable{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (namespace, cluster) > 0
  metricName: podsUnschedulable

# Container waiting reasons - why pods are stuck
- query: sum(kube_pod_container_status_waiting_reason{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (namespace, pod, reason, cluster)
  metricName: containerWaitingReason

# Container readiness status
- query: sum(kube_pod_container_status_ready{cluster="{{.GKE_MC_CLUSTER_NAME}}"}) by (namespace, pod, cluster)
  metricName: containerReadyStatus
